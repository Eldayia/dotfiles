# --- CONFIGURATION HYPRLAND COMPLETE ---

# 1. ÉCRAN & RÉSOLUTION
# Hyper-V avec GPU-PV - résolution native
monitor=,1920x1080@60,auto,1

# 2. VARIABLES D'ENVIRONNEMENT
env = WLR_NO_HARDWARE_CURSORS,1
env = NIXOS_OZONE_WL,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Set programs that you use
$terminal = warp-terminal
$fileManager = nautilus
$menu = wofi --show drun

# 3. DÉMARRAGE AUTOMATIQUE
exec-once = waybar
exec-once = dunst

# 4. CLAVIER ET SOURIS
input {
    kb_layout = fr
    follow_mouse = 1
    sensitivity = 0
}

# 5. APPARENCE GÉNÉRALE
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

# 6. DÉCORATION (Nouvelle Syntaxe pour Hyprland v0.40+)
decoration {
    rounding = 10

    blur {
        enabled = false
        size = 3
        passes = 1
    }

    shadow {
        enabled = true
        range = 2
        render_power = 2
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, myBezier
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# 7. RACCOURCIS CLAVIER
$mainMod = SUPER

# Applications
bind = $mainMod, T, exec, warp-terminal
bind = $mainMod, Q, exec, kitty
bind = $mainMod, B, exec, microsoft-edge
bind = $mainMod, E, exec, kitty -e yazi
bind = $mainMod, space, exec, wofi --show drun -i
bind = $mainMod, W, exec, waybar

# Gestion Fenêtres
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Focus (Flèches)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces 1-5
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Déplacer vers Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Souris
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
