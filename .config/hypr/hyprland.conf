# --- CONFIGURATION HYPRLAND - Inspired by dots-hyprland ---

# 1. ÉCRAN & RÉSOLUTION
monitor=,1280x720@60,auto,1

# 2. VARIABLES D'ENVIRONNEMENT
env = WLR_NO_HARDWARE_CURSORS,1
env = NIXOS_OZONE_WL,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Programs
$terminal = kitty
$fileManager = nautilus
$menu = wofi --show drun

# 3. DÉMARRAGE AUTOMATIQUE
exec-once = waybar
exec-once = dunst
exec-once = ~/.config/hypr/scripts/random-wallpaper.sh

# 4. CLAVIER ET SOURIS
input {
    kb_layout = fr
    follow_mouse = 1
    sensitivity = 0
}

# 5. APPARENCE GÉNÉRALE - Style carré avec léger arrondi
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
    resize_on_border = true
}

# 6. DÉCORATION - Transparence élevée, coins carrés
decoration {
    rounding = 4

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 1.0
        brightness = 1.0
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(0, 0, 0, 0.5)
    }

    dim_inactive = true
    dim_strength = 0.15

    active_opacity = 0.92
    inactive_opacity = 0.85
}

# 7. ANIMATIONS - Smooth et modernes
animations {
    enabled = true

    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, smoothIn, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 100, default, loop
    animation = fade, 1, 4, smoothIn
    animation = fadeDim, 1, 4, smoothIn
    animation = workspaces, 1, 4, overshot, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    vfr = true
}

# 8. RACCOURCIS CLAVIER
$mainMod = SUPER

# Applications
bind = $mainMod, Q, exec, kitty
bind = $mainMod, T, exec, warp-terminal
bind = $mainMod, B, exec, microsoft-edge
bind = $mainMod, v, exec, vesktop
bind = $mainMod, E, exec, nautilus
bind = $mainMod, space, exec, wofi --show drun -i
bind = $mainMod, W, exec, pkill waybar || waybar

# Wallpaper aléatoire
bind = $mainMod, R, exec, ~/.config/hypr/scripts/random-wallpaper.sh

# Gestion Fenêtres
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1

# Focus (Flèches + HJKL)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod SHIFT, J, movefocus, d

# Déplacer fenêtres
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u

# Redimensionner
bind = $mainMod CTRL, left, resizeactive, -20 0
bind = $mainMod CTRL, right, resizeactive, 20 0
bind = $mainMod CTRL, up, resizeactive, 0 -20
bind = $mainMod CTRL, down, resizeactive, 0 20

# Workspaces 1-9
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Déplacer vers Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Souris
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

# 9. WINDOW RULES - Transparence augmentée
windowrulev2 = opacity 0.85, class:^(kitty)$
windowrulev2 = opacity 0.88, class:^(Code)$
windowrulev2 = opacity 0.90, class:^(firefox)$
windowrulev2 = opacity 0.90, class:^(chromium)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
