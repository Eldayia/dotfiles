# --- CONFIGURATION i3status ---
# Configuration de la barre de statut i3

general {
    output_format = "i3bar"
    colors = true
    interval = 5
    color_good = "#00ff99"
    color_bad = "#ff0000"
    color_degraded = "#ffaa00"
}

# Ordre des modules dans la barre (de gauche à droite)
order += "disk /"
order += "memory"
order += "cpu_usage"
order += "load"
order += "tztime local"

# Espace disque
disk "/" {
    format = " 💾 %avail "
}

# Mémoire RAM
memory {
    format = " 🧠 %used / %total "
    threshold_degraded = "10%"
    threshold_critical = "5%"
}

# Utilisation CPU
cpu_usage {
    format = " ⚡ CPU: %usage "
    max_threshold = 75
    degraded_threshold = 50
}

# Load average
load {
    format = " 📊 %1min "
    max_threshold = "4"
}

# Date et heure
tztime local {
    format = " 📅 %d/%m/%Y 🕐 %H:%M:%S "
}
