# --- CONFIGURATION STARSHIP ---
# Prompt shell moderne et rapide

# Format du prompt
format = """
[╭─](bold green)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$git_metrics\
$fill\
$cmd_duration\
$jobs\
$time\
$line_break\
[╰─](bold green)$character"""

# Prompt de droite
right_format = """$all"""

# Timeout global (ms)
scan_timeout = 30
command_timeout = 500

# Caractère du prompt
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[❮](bold green)"

# Nom d'utilisateur
[username]
show_always = false
format = "[$user]($style)@"
style_user = "bold yellow"
style_root = "bold red"

# Hostname
[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold blue"
disabled = false

# Répertoire courant
[directory]
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
read_only = " 🔒"
read_only_style = "red"
home_symbol = "~"

# Git - Branche
[git_branch]
format = "on [$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold purple"

# Git - Status
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
conflicted = "🏳 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = "✓ "
untracked = "?${count} "
stashed = "📦 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# Git - État (rebase, merge, etc.)
[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

# Git - Métriques
[git_metrics]
added_style = "bold green"
deleted_style = "bold red"
only_nonzero_diffs = true
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'
disabled = false

# Fill - Espace entre gauche et droite
[fill]
symbol = " "

# Durée de la commande
[cmd_duration]
min_time = 500
format = "took [$duration]($style) "
style = "bold yellow"

# Jobs en arrière-plan
[jobs]
format = "[$symbol$number]($style) "
symbol = "✦ "
style = "bold blue"

# Heure
[time]
disabled = false
format = "at [$time]($style) "
style = "bold white"
time_format = "%T"

# Langages et outils
[nodejs]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold green"

[python]
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = " "
style = "bold yellow"

[rust]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold red"

[golang]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold cyan"

[nix_shell]
format = 'via [$symbol$state( \($name\))]($style) '
symbol = "❄️  "
style = "bold blue"
impure_msg = "[impure](bold red)"
pure_msg = "[pure](bold green)"

[docker_context]
format = "via [$symbol$context]($style) "
symbol = " "
style = "bold blue"

# Package
[package]
format = "is [$symbol$version]($style) "
symbol = "📦 "
style = "bold 208"

# Mémoire
[memory_usage]
disabled = true
threshold = 75
format = "via $symbol[$ram( | $swap)]($style) "
symbol = "🐏 "
style = "bold dimmed white"

# Batterie
[battery]
full_symbol = "🔋 "
charging_symbol = "⚡️ "
discharging_symbol = "💀 "
disabled = true

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

# Shell
[shell]
disabled = true
format = "[$indicator]($style) "
bash_indicator = "bsh"
fish_indicator = "fsh"
zsh_indicator = "zsh"
nu_indicator = "nu"
style = "cyan bold"

# OS
[os]
disabled = true
format = "on [$symbol]($style) "

[os.symbols]
NixOS = "❄️ "
Arch = " "
Ubuntu = " "
Debian = " "

# Statut de la dernière commande
[status]
disabled = false
format = '[\[$symbol$common_meaning$signal_name$maybe_int\]]($style) '
symbol = "✖ "
style = "bold red"
