# --- CONFIGURATION YAZI ---
# File manager en terminal moderne

[manager]
# Ratio des colonnes (parent:current:preview)
ratio = [1, 3, 4]
sort_by = "modified"
sort_sensitive = false
sort_reverse = true
sort_dir_first = true
sort_translit = false
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
tab_size = 2
max_width = 600
max_height = 900
cache_dir = ""
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
# Éditeur de texte
edit = [
    { run = 'nvim "$@"', block = true, for = "unix" },
]

# Navigateur web
open = [
    { run = 'xdg-open "$@"', desc = "Open", for = "unix" },
]

# Lecteur vidéo
play = [
    { run = 'vlc "$@"', orphan = true, for = "unix" },
]

# Visionneuse d'images
view = [
    { run = 'imv "$@"', orphan = true, for = "unix" },
]

# Archives
extract = [
    { run = 'unp "$@"', desc = "Extract here", for = "unix" },
]

[open]
# Extensions et applications associées
rules = [
    { name = "*/", use = "edit" },

    # Texte
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/x-yaml", use = "edit" },

    # Images
    { mime = "image/*", use = "view" },

    # Vidéos
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "play" },

    # Archives
    { mime = "application/zip", use = "extract" },
    { mime = "application/x-tar", use = "extract" },
    { mime = "application/x-7z-compressed", use = "extract" },

    # Par défaut
    { mime = "*", use = "open" },
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
image_alloc = 536870912  # 512MB
image_bound = [0, 0]
suppress_preload = false

[plugin]
preloaders = []
previewers = []

[input]
cursor_blink = false

[log]
enabled = false
