[Service]
Environment="DMS_SHELL_DIR=%h/.local/share/dms-command-center/quickshell"
# DMS must resolve the user-installed dsearch binary and user commands.
Environment="PATH=%h/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/lib/jvm/default/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl:/usr/lib/rustup/bin"
# UI is rebuilt from the pinned official source plus the versioned patch.
ExecStart=
ExecStart=/usr/bin/dms -c %h/.local/share/dms-command-center/quickshell run --session
