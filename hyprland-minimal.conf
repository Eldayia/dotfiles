# --- CONFIGURATION HYPRLAND MINIMALE POUR TEST ---
# Utiliser cette config pour diagnostiquer les problèmes

# ÉCRAN
monitor=,preferred,auto,1.3333334

# VARIABLES D'ENVIRONNEMENT (CRITIQUE POUR VM)
env = WLR_NO_HARDWARE_CURSORS,1
env = NIXOS_OZONE_WL,1
env = XCURSOR_SIZE,24

# PROGRAMMES
$terminal = kitty
$menu = wofi --show drun

# DÉMARRAGE - Simpllifié pour debug
exec-once = waybar
exec-once = dunst

# CLAVIER
input {
    kb_layout = fr
    follow_mouse = 1
    sensitivity = 0
}

# APPARENCE MINIMALE
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

# DÉCORATION MINIMALE (pour VM)
decoration {
    rounding = 5
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

# ANIMATIONS DÉSACTIVÉES pour debug
animations {
    enabled = false
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# RACCOURCIS SIMPLIFIÉS
$mainMod = CTRL

# Applications - SANS workspace pour debug
bind = $mainMod, T, exec, kitty
bind = $mainMod, space, exec, wofi --show drun

# Gestion Fenêtres
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces basiques
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3

# Souris
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
