# ============================================================
# KITTY — terminal de secours (Ghostty reste le terminal principal)
# Recharger : ctrl+shift+F5 · Aide : ctrl+shift+F1
# ============================================================

include themes/catppuccin-mocha.conf


# ------------------------------------------------------------
# Police
# ------------------------------------------------------------

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

disable_ligatures cursor
modify_font      cell_height 110%


# ------------------------------------------------------------
# Fenêtre et transparence (le flou est appliqué par Niri)
# ------------------------------------------------------------

linux_display_server       wayland
hide_window_decorations    yes
window_padding_width       8 12
placement_strategy         center
confirm_os_window_close    0
remember_window_size       no

background_opacity         0.85
dynamic_background_opacity yes

# Splits inactifs légèrement estompés.
inactive_text_alpha        0.75
window_border_width        1pt
draw_minimal_borders       yes


# ------------------------------------------------------------
# Curseur
# ------------------------------------------------------------

cursor_shape            beam
cursor_beam_thickness   1.8
cursor_blink_interval   0
cursor_trail            3
cursor_trail_decay      0.1 0.4
cursor_trail_start_threshold 2


# ------------------------------------------------------------
# Défilement, URL et presse-papiers
# ------------------------------------------------------------

scrollback_lines               10000
scrollback_pager_history_size  64
wheel_scroll_multiplier        3.0
touch_scroll_multiplier        2.0

url_style                 curly
detect_urls               yes
show_hyperlink_targets    yes
underline_hyperlinks      hover

copy_on_select            no
strip_trailing_spaces     smart
paste_actions             quote-urls-at-prompt,confirm-if-large
clipboard_control         write-clipboard write-primary read-clipboard-ask read-primary-ask


# ------------------------------------------------------------
# Cloche et notifications
# ------------------------------------------------------------

enable_audio_bell   no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab         "󰂞 "

# Notification quand une longue commande se termine hors focus.
notify_on_cmd_finish unfocused 15.0


# ------------------------------------------------------------
# Onglets
# ------------------------------------------------------------

tab_bar_edge          top
tab_bar_margin_width  6.0
tab_bar_margin_height 6.0 0.0
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2
tab_activity_symbol   "󰐾 "
tab_title_max_length  32
tab_title_template    "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab} {index}  {title}{' 󰍉' if layout_name == 'stack' and num_windows > 1 else ''} "
active_tab_font_style bold


# ------------------------------------------------------------
# Dispositions (splits façon tmux)
# ------------------------------------------------------------

enabled_layouts splits,stack,tall,grid


# ------------------------------------------------------------
# Shell et contrôle à distance (requis par kitty-scrollback.nvim)
# ------------------------------------------------------------

shell_integration     enabled
allow_remote_control  socket-only
listen_on             unix:@kitty-{kitty_pid}
update_check_interval 0


# ------------------------------------------------------------
# Raccourcis — kitty_mod = ctrl+shift
# ------------------------------------------------------------

kitty_mod ctrl+shift

# Splits
map kitty_mod+enter launch --location=split --cwd=current
map kitty_mod+backslash launch --location=vsplit --cwd=current
map kitty_mod+minus     launch --location=hsplit --cwd=current
map kitty_mod+x         close_window
map kitty_mod+z         toggle_layout stack
map kitty_mod+l         next_layout

# Navigation et déplacement entre splits
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right
map alt+shift+h move_window left
map alt+shift+j move_window down
map alt+shift+k move_window up
map alt+shift+l move_window right
map alt+left  resize_window narrower 2
map alt+right resize_window wider 2
map alt+up    resize_window taller 2
map alt+down  resize_window shorter 2

# Onglets
map kitty_mod+t new_tab_with_cwd
map kitty_mod+w close_tab
map kitty_mod+comma set_tab_title
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Taille de police (comme Ghostty)
map ctrl+plus  change_font_size all +1.0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# Opacité à la volée
map kitty_mod+a>k set_background_opacity +0.05
map kitty_mod+a>j set_background_opacity -0.05
map kitty_mod+a>1 set_background_opacity 1
map kitty_mod+a>d set_background_opacity default

# Navigation dans les sorties de commandes (shell integration)
map kitty_mod+up   scroll_to_prompt -1
map kitty_mod+down scroll_to_prompt 1

# Shift+Entrée envoie un saut de ligne (comme Ghostty)
map shift+enter send_text all \n


# ------------------------------------------------------------
# Kittens
# ------------------------------------------------------------

# hints : sélection clavier de ce qui est à l'écran
map kitty_mod+o     open_url_with_hints
map kitty_mod+p>f   kitten hints --type path --program -
map kitty_mod+p>o   kitten hints --type path
map kitty_mod+p>h   kitten hints --type hash --program -
map kitty_mod+p>l   kitten hints --type line --program -
map kitty_mod+p>w   kitten hints --type word --program -
map kitty_mod+p>n   kitten hints --type linenum nvim +{line} {path}
map kitty_mod+p>i   kitten hints --type ip --program -
map kitty_mod+p>c   kitten hints --type regex --regex "`[^`]+`" --program @

# Saisie Unicode, emojis et symboles Nerd Font
map kitty_mod+u kitten unicode_input

# Diffuser la saisie vers toutes les fenêtres de l'onglet
map kitty_mod+b launch --allow-remote-control kitten broadcast --match-tab state:focused

# Sélecteur de thème (aperçu en direct)
map kitty_mod+f6 kitten themes

# kitty-scrollback.nvim : historique ouvert dans Neovim
action_alias kitty_scrollback_nvim kitten /home/eldayia/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
