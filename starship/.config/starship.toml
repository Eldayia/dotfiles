# Starship — reprend la disposition de l'ancien p10k « rainbow » :
# $fill pousse les modules de droite en bout de première ligne.
# ligne 1 : OS · dossier · git (gauche) / statut · durée · langages · heure (droite)
# ligne 2 : symbole de prompt
"$schema" = "https://starship.rs/config-schema.json"

palette = "catppuccin_mocha"
add_newline = true
command_timeout = 800

format = """
[](mauve)\
$os\
[](bg:lavender fg:mauve)\
$directory\
[](fg:lavender bg:surface0)\
$git_branch\
$git_state\
$git_status\
[](fg:surface0)\
$fill\
$status\
$cmd_duration\
$jobs\
$direnv\
$python\
$nodejs\
$rust\
$golang\
$c\
$docker_context\
$time\
$line_break\
$character"""

[fill]
symbol = " "

[os]
disabled = false
style = "bg:mauve fg:crust"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇"
Linux = ""

[directory]
style = "bold bg:lavender fg:crust"
format = "[ $path ]($style)[$read_only]($read_only_style)"
read_only = " 󰌾"
read_only_style = "bg:lavender fg:red"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Téléchargements" = " "
"dotfiles" = " dotfiles"

[git_branch]
symbol = ""
style = "bg:surface0 fg:green"
format = "[ $symbol $branch ]($style)"

[git_state]
style = "bg:surface0 fg:yellow"
format = "[\\($state( $progress_current/$progress_total)\\) ]($style)"

[git_status]
style = "bg:surface0 fg:peach"
format = "[($all_status$ahead_behind )]($style)"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
deleted = "✘${count}"
stashed = "*${count}"
conflicted = "~${count}"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"

[status]
disabled = false
symbol = "✘ "
style = "fg:red"
format = "[$symbol$status]($style) "

[cmd_duration]
min_time = 3_000
style = "fg:yellow"
format = "[ $duration]($style) "

[jobs]
symbol = " "
style = "fg:sky"
format = "[$symbol$number]($style) "

[direnv]
disabled = false
style = "fg:teal"
format = "[$symbol$loaded]($style) "
symbol = "direnv "
loaded = ""
unloaded = "✗"

[python]
symbol = " "
style = "fg:yellow"
format = "[$symbol($version )(\\($virtualenv\\) )]($style)"

[nodejs]
symbol = " "
style = "fg:green"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "fg:peach"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "fg:sapphire"
format = "[$symbol($version )]($style)"

[c]
symbol = " "
style = "fg:blue"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "fg:blue"
format = "[$symbol$context ]($style)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:overlay1"
format = "[ $time]($style)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
